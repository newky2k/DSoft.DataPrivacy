# Pull request validation: builds Release and runs the tests on .NET 8 and .NET 10. Publishes nothing.

trigger: none

pool:
  vmImage: 'windows-latest'

variables:
  solution: 'GDPRCore.slnx'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'
  netVersion: '10.x'

steps:
- task: NuGetToolInstaller@1
  displayName: Install Latest Nuget

- task: UseDotNet@2
  displayName: 'Install .NET 8 runtime (tests)'
  inputs:
    packageType: 'runtime'
    version: '8.x'

- task: UseDotNet@2
  displayName: 'Install .NET sdk'
  inputs:
    packageType: 'sdk'
    version: $(netVersion)

- task: DotNetCoreCLI@2
  displayName: dotnet restore
  inputs:
    command: 'restore'
    projects: '$(solution)'

- task: DotNetCoreCLI@2
  displayName: dotnet build
  inputs:
    projects: '$(solution)'
    arguments: '--configuration=$(buildConfiguration) /p:Platform="$(buildPlatform)"'

- task: DotNetCoreCLI@2
  displayName: dotnet test
  inputs:
    command: 'test'
    projects: '$(solution)'
    arguments: '--configuration=$(buildConfiguration) --no-build'
