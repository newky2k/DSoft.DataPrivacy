# Release: builds Release on main, runs the tests, and publishes the DSoft.*.nupkg packages as the 'drop' artifact.

trigger:
  batch: true
  branches:
    include:
    - main
  paths:
    exclude:
    - azure-pipelines-release.yml
    - azure-pipelines-mergetest.yml
    - README.md
    - CLAUDE.md
    - AGENTS.md

pool:
  vmImage: 'windows-latest'

variables:
- name: solution
  value: 'GDPRCore.slnx'
- name: buildPlatform
  value: 'Any CPU'
- name: buildConfiguration
  value: 'Release'
- name: netVersion
  value: '10.x'
- name: releaseSuffix
  value: '-prerelease'

name: 1.0.$(date:yyMM).$(date:dd)$(rev:r)

steps:
- task: NuGetToolInstaller@1
  displayName: Install Latest Nuget

- task: UseDotNet@2
  displayName: 'Install .NET sdk'
  inputs:
    packageType: 'sdk'
    version: $(netVersion)

- task: DotNetCoreCLI@2
  displayName: dotnet restore
  inputs:
    command: 'restore'
    projects: '$(solution)'

- task: DotNetCoreCLI@2
  displayName: dotnet build
  inputs:
    projects: '$(solution)'
    arguments: '--configuration=$(buildConfiguration) /p:Platform="$(buildPlatform)" /p:Version=$(Build.BuildNumber)$(releaseSuffix) /p:AssemblyVersion=$(Build.BuildNumber) /p:FileVersion=$(Build.BuildNumber) '

- task: DotNetCoreCLI@2
  displayName: dotnet test
  inputs:
    command: 'test'
    projects: '$(solution)'
    arguments: '--configuration=$(buildConfiguration) --no-build'

- task: CopyFiles@2
  displayName: Copy Files to $(build.artifactstagingdirectory)
  inputs:
    SourceFolder: '$(system.defaultworkingdirectory)'
    Contents: '**/DSoft.*.nupkg'
    TargetFolder: '$(build.artifactstagingdirectory)'
    flattenFolders: true

- task: PublishBuildArtifacts@1
  displayName: Publish Artifacts drop
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'
